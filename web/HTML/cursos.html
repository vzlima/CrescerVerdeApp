    <div class="page-header">
      <h1><i class="fas fa-book-open"></i> Cursos</h1>
      <p>Trilhas de aprendizado sobre sustentabilidade e meio ambiente</p>
    </div>

    <main>
      <div id="admin-actions" class="mb-4" style="display: none">
        <button
          class="btn btn-success fw-bold px-4 py-2"
          data-bs-toggle="modal"
          data-bs-target="#courseModal"
        >
          + Novo
        </button>
      </div>

      <div class="modal fade" id="courseModal" tabindex="-1" aria-labelledby="courseModalLabel" aria-hidden="true">
        <div class="modal-dialog" style="color: black">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="courseModalLabel">Criar Curso</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="createCourseForm">
              <input type="hidden" id="courseId" />
              <div class="modal-body text-start">
                <div class="mb-3">
                  <label for="courseTitle" class="form-label">Título do Curso</label>
                  <input type="text" class="form-control" id="courseTitle" required />
                </div>
                <div class="mb-3">
                  <label for="courseDescription" class="form-label">Descrição</label>
                  <textarea class="form-control" id="courseDescription" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                  <label for="courseCoverImage" class="form-label">URL da Imagem de Capa</label>
                  <input type="url" class="form-control" id="courseCoverImage" placeholder="https://exemplo.com/imagem.png" />
                </div>
                <div class="mb-3">
                  <label for="courseVideoUrl" class="form-label">URL do Vídeo</label>
                  <input type="url" class="form-control" id="courseVideoUrl" placeholder="https://exemplo.com/video.mp4" />
                </div>
                <div id="modal-error" class="text-danger mt-2" style="display: none"></div>
              </div>
              <div class="modal-footer d-flex justify-content-between">
                <button type="button" class="btn btn-danger" id="deleteCourseBtn" style="display: none">Excluir</button>
                <div>
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                  <button type="submit" class="btn btn-success">Salvar</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div id="courses-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 mt-2">
        <div class="col w-100 text-center">
          <p>Carregando cursos...</p>
        </div>
      </div>
    </main>
